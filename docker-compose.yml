services:
  tiingo-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      TIINGO_API_KEY: ${TIINGO_API_KEY:?set TIINGO_API_KEY}
      PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8000)+'/mcp').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
